name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Run unit tests
        # Integration tests that call the real Claude API are skipped
        # here unless ANTHROPIC_API_KEY is configured as a repo secret —
        # see tests/integration/test_unseen_decline_reason.py for the
        # skip condition. Unit tests never require external credentials.
        run: pytest tests/unit -v
        env:
          RAZORPAY_KEY_ID: rzp_test_placeholder_for_ci
          RAZORPAY_KEY_SECRET: placeholder_for_ci
          RAZORPAY_WEBHOOK_SECRET: placeholder_for_ci
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'placeholder_for_ci' }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
